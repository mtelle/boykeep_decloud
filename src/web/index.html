<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cámara</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#151822; --panel-2:#1b1f2a; --line:#262b38;
    --fg:#eceef2; --mut:#8b93a3; --acc:#3b82f6; --acc2:#2563eb; --rec:#ef4444;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
    --radius:14px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);
          position:sticky; top:0; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); z-index:5; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand svg{ width:20px; height:20px; color:var(--acc); flex:0 0 auto; }
  header h1{ font-size:15px; margin:0; font-weight:600; letter-spacing:.01em; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#3a4050; transition:background .2s,box-shadow .2s; }
  .dot.on{ background:var(--rec); box-shadow:0 0 0 4px rgba(239,68,68,.18), 0 0 8px var(--rec); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.55 } }
  #motiontxt{ font-size:13px; color:var(--mut); transition:color .2s; }
  #motiontxt.on{ color:var(--rec); font-weight:600; }
  .gear{ margin-left:auto; color:var(--mut); text-decoration:none; font-size:17px; line-height:1; padding:6px; border-radius:8px; transition:.15s; }
  .gear:hover{ color:var(--fg); background:var(--panel-2); }
  main{ max-width:760px; margin:0 auto; padding:16px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .live{ position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
  .live img{ width:100%; height:100%; object-fit:contain; display:block; }
  .live .tag{ position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.03em; color:#fff; }
  .live .tag:before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--rec); box-shadow:0 0 6px var(--rec); animation:pulse 1.4s ease-in-out infinite; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 12px; font-weight:700; }
  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; margin:0 auto; }
  .pad button{ background:linear-gradient(180deg,#262b38,#1b1f29); color:var(--fg); border:1px solid var(--line);
               border-radius:12px; padding:16px 0; font-size:20px; cursor:pointer; user-select:none;
               transition:transform .1s,border-color .15s,background .15s; }
  .pad button:hover{ border-color:#3a4155; }
  .pad button:active{ background:linear-gradient(180deg,var(--acc),var(--acc2)); transform:scale(.94); border-color:var(--acc); }
  .pad .sp{ visibility:hidden; }
  .clips{ display:flex; flex-direction:column; gap:8px; }
  .day{ color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin:10px 0 2px; }
  .day-folder{ display:flex; align-items:center; gap:8px; padding:11px 12px; background:var(--panel-2); border:1px solid var(--line);
               border-radius:10px; cursor:pointer; user-select:none; margin-top:4px; transition:border-color .15s,background .15s; }
  .day-folder:hover{ border-color:#3a4155; background:#20242f; }
  .day-folder .arrow{ color:var(--acc); font-size:12px; width:12px; flex:0 0 auto; display:inline-block; transition:transform .18s; }
  .day-folder.open .arrow{ transform:rotate(90deg); }
  .day-folder .lbl{ flex:1; font-weight:500; }
  .day-folder small{ color:var(--mut); }
  .day-body{ display:flex; flex-direction:column; gap:8px; margin:6px 0 0 4px; padding-left:12px; border-left:2px solid var(--line); }
  .clip{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; transition:border-color .15s; }
  .clip:hover{ border-color:#3a4155; }
  .more{ background:var(--panel-2); color:var(--acc); border:1px solid var(--line); border-radius:10px; padding:9px 10px; cursor:pointer; font-size:13px; font-weight:600; text-align:center; transition:border-color .15s,background .15s; }
  .more:hover{ border-color:var(--acc); background:#20242f; }
  .clip .t{ flex:1; min-width:0; }
  .clip .t b{ font-weight:600; } .clip .t small{ color:var(--mut); }
  .clip a, .clip button{ color:var(--acc); background:none; border:0; cursor:pointer; font-size:14px; text-decoration:none; padding:4px; border-radius:6px; transition:background .15s; }
  .clip a:hover, .clip button:hover{ background:rgba(59,130,246,.12); }
  video{ width:100%; border-radius:10px; margin-top:8px; background:#000; }
  .muted{ color:var(--mut); font-size:13px; }
  code{ background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <h1>Cámara</h1>
  </div>
  <span class="dot" id="recdot" style="margin-left:14px"></span>
  <span id="motiontxt">sin movimiento</span>
  <a href="/config.html" title="Ajustes" class="gear">⚙</a>
  <span class="muted" id="clock"></span>
</header>
<main>
  <div class="card">
    <div class="live"><img id="live" alt="directo"><span class="tag" id="livetag">EN VIVO</span></div>
  </div>

  <div class="card">
    <h2>Mover cámara</h2>
    <div class="pad">
      <span class="sp"></span><button data-d="up">▲</button><span class="sp"></span>
      <button data-d="left">◀</button><button data-d="home">⌂</button><button data-d="right">▶</button>
      <span class="sp"></span><button data-d="down">▼</button><span class="sp"></span>
    </div>
  </div>

  <div class="card">
    <h2>Grabaciones por movimiento</h2>
    <div id="clips" class="clips"><span class="muted">Cargando…</span></div>
  </div>
  <p class="muted">Vídeo íntegro en vivo (1080p) por RTSP: <code id="rtsp"></code> — ábrelo en VLC o Home Assistant.</p>
</main>
<script>
// ---- live view: poll the snapshot JPEG (works in every browser) ----
var live=document.getElementById('live'), FPS=5;
function liveTick(){ var i=new Image(); i.onload=function(){ live.src=i.src; }; i.src='/snapshot.jpg?'+Date.now(); }
setInterval(liveTick, Math.round(1000/FPS)); liveTick();

// ---- PTZ: press and hold ----
function ptz(d){ fetch('/cgi-bin/ptz.cgi?dir='+d).catch(function(){}); }
document.querySelectorAll('.pad button').forEach(function(b){
  var d=b.getAttribute('data-d');
  if(d==='home'){ b.addEventListener('click',function(){ ptz('home'); }); return; }
  var start=function(e){ e.preventDefault(); ptz(d); };
  var end=function(){ ptz('stop'); };
  b.addEventListener('pointerdown',start); b.addEventListener('pointerup',end);
  b.addEventListener('pointerleave',end); b.addEventListener('pointercancel',end);
});
// ---- recordings: today's clips flat, other days as lazy-loaded folders. Server-paginated
// (rec.cgi) so we never fetch/send the whole history, only the page actually shown. ----
function fmtSize(n){ if(n>1048576) return (n/1048576).toFixed(1)+' MB'; if(n>1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
function prettyName(f){ var m=f.match(/_(\d{2})(\d{2})(\d{2})\./); return m? m[1]+':'+m[2]+':'+m[3] : f; }
function prettyDay(day){ return day.replace(/(\d{4})(\d{2})(\d{2})/,'$3/$2/$1'); }
function renderClipRow(c){
  var row=document.createElement('div'); row.className='clip';
  var isMp4=/\.mp4$/.test(c.file);
  row.innerHTML='<div class="t"><b>'+prettyName(c.file)+'</b> <small>'+fmtSize(c.size)+'</small></div>'+
    (isMp4?'<button>▶ Ver</button>':'')+'<a href="'+c.url+'" download>⬇</a>';
  if(isMp4){ row.querySelector('button').onclick=function(){
    var ex=row.parentNode.querySelector('video'); if(ex) ex.remove();
    var v=document.createElement('video'); v.src=c.url; v.controls=true; v.autoplay=true;
    row.after(v); }; }
  return row;
}
var PAGE_SIZE=30;
// fetches one page of a day's clips from the server; day='' means "today" (rec.cgi's default)
function fetchPage(day, offset){
  var q = day ? ('day='+day+'&') : '';
  return fetch('/cgi-bin/rec.cgi?'+q+'offset='+offset+'&limit='+PAGE_SIZE).then(function(r){return r.json();});
}
// fetches one page of the day-folder list (older days, today excluded server-side)
function fetchDaysPage(offset){
  return fetch('/cgi-bin/rec.cgi?list=days&offset='+offset+'&limit='+PAGE_SIZE).then(function(r){return r.json();});
}
// generic "render first page + Ver más button that fetches further pages" wiring
function wirePagingGeneric(host, firstItems, total, renderItem, fetchNext){
  var shown=firstItems.length;
  firstItems.forEach(function(it){ host.appendChild(renderItem(it)); });
  var btn=document.createElement('div'); btn.className='more'; host.appendChild(btn);
  function refreshBtn(){
    var left=total-shown;
    if(left>0){ btn.textContent='Ver más ('+left+' restantes)'; btn.style.display='block'; }
    else { btn.style.display='none'; }
  }
  btn.onclick=function(){
    fetchNext(shown).then(function(j){
      total=j.total;
      var items=j.clips||j.days||[];
      items.forEach(function(it){ host.insertBefore(renderItem(it), btn); });
      shown+=items.length;
      refreshBtn();
    });
  };
  refreshBtn();
  // lets a periodic check add newly-arrived items at the top without rebuilding anything
  // (no touching open folders, playing videos, scroll position, Ver más state...)
  return {
    prependNew: function(newItems){
      newItems.slice().reverse().forEach(function(it){ host.insertBefore(renderItem(it), host.firstChild); });
      total+=newItems.length; shown+=newItems.length;
      refreshBtn();
    },
    getTotal: function(){ return total; }
  };
}
function wirePaging(host, day, firstClips, total){
  return wirePagingGeneric(host, firstClips, total, renderClipRow, function(off){ return fetchPage(day, off); });
}
function pollMotion(){
  fetch('/cgi-bin/health.cgi').then(function(r){return r.json();}).then(function(j){
    var on = (j.recording === 'yes');
    document.getElementById('recdot').className='dot'+(on?' on':'');
    var t=document.getElementById('motiontxt');
    t.className = on?'on':'';
    t.textContent = on?'movimiento detectado':'sin movimiento';
  }).catch(function(){});
}
setInterval(pollMotion, 3000); pollMotion();
function renderDayFolder(d){
  var wrap=document.createElement('div'); wrap.className='day-entry';
  var folder=document.createElement('div'); folder.className='day-folder';
  var arrow=document.createElement('span'); arrow.className='arrow'; arrow.textContent='▸';
  var lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=prettyDay(d.day);
  var count=document.createElement('small'); count.textContent=d.count+(d.count===1?' grabación':' grabaciones');
  folder.appendChild(arrow); folder.appendChild(lbl); folder.appendChild(count);
  var body=document.createElement('div'); body.className='day-body'; body.style.display='none';
  var loaded=false;
  folder.onclick=function(){
    var open=body.style.display!=='none';
    if(!open && !loaded){
      loaded=true;
      fetchPage(d.day, 0).then(function(j2){ wirePaging(body, d.day, j2.clips||[], j2.total); });
    }
    body.style.display=open?'none':'flex';
    folder.classList.toggle('open', !open);
  };
  wrap.appendChild(folder); wrap.appendChild(body);
  return wrap;
}
function loadClips(){
  var host=document.getElementById('clips'); host.innerHTML='';
  var todayHost=document.createElement('div'); host.appendChild(todayHost);
  var daysHost=document.createElement('div'); host.appendChild(daysHost);
  Promise.all([
    fetchPage('', 0),
    fetchDaysPage(0)
  ]).then(function(results){
    var j=results[0], jd=results[1];
    document.getElementById('recdot').className='dot'+(j.recording?' on':'');
    var hasToday=(j.clips&&j.clips.length)>0, hasDays=(jd.days&&jd.days.length)>0;
    if(!hasToday && !hasDays){ host.innerHTML='<span class="muted">Aún no hay grabaciones.</span>'; return; }
    if(hasToday){
      var h=document.createElement('div'); h.className='day';
      h.textContent=prettyDay(j.today)+' (hoy)'; todayHost.appendChild(h);
      var flat=document.createElement('div'); flat.className='clips';
      todayHost.appendChild(flat);
      todayCtl = wirePaging(flat, '', j.clips, j.total);
    }
    if(hasDays){
      wirePagingGeneric(daysHost, jd.days, jd.total, renderDayFolder, fetchDaysPage);
    }
  }).catch(function(){ document.getElementById('clips').innerHTML='<span class="muted">No se pudo leer la lista.</span>'; });
}
// periodic check: only ADDS newly-arrived clips at the top of today's list (no full rebuild,
// so an open day-folder, a playing video or the scroll position are never disturbed)
var todayCtl=null;
function pollNewClips(){
  if(!todayCtl) return;
  fetchPage('', 0).then(function(j){
    document.getElementById('recdot').className='dot'+(j.recording?' on':'');
    var newCount=j.total-todayCtl.getTotal();
    if(newCount>0){ todayCtl.prependNew((j.clips||[]).slice(0, newCount)); }
  }).catch(function(){});
}
loadClips();
setInterval(pollNewClips, 10000);

// ---- misc ----
document.getElementById('rtsp').textContent='rtsp://'+location.hostname+':554/vs0';
function clk(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString(); }
setInterval(clk,1000); clk();
</script>
</body>
</html>
