[camera]
mode = 0
sensor_cnt = 1

[single_cfg]
isp_conf = /system/etc/config/isp_gc2083_mipi_2lane_h3b.conf
single_dev = 0

[video0]
code_type = h.265     # H.264 confirmed impossible on BOTH channels: silently falls back to MJPEG
                       # on chn0 (no error, verified via MD_DBG trace) and errors outright on chn1.
width = 1920
height = 1080
fps = 15
target_kbps = 1536

[video1]
code_type = h.264
enc_type = 2        # H264 confirmed rejected on vs1 (venc_check_and_format_param: enc_out_type error 0) - keep HEVC
profile_type = 4     # PROFILE_HEVC_MAIN
width = 1280
height = 720
fps = 15
target_kbps = 1024

[audio]
code_type = aac
sample_rate = 16000
