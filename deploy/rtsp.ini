[camera]
mode = 0
sensor_cnt = 1

[single_cfg]
isp_conf = /system/etc/config/isp_gc2083_mipi_2lane_h3b.conf
single_dev = 0

[video0]
# Comments must be on their own line: this parser keeps an inline "# ..." as part of the value,
# and an unrecognised code_type silently falls back to MJPEG.
code_type = h.265
width = 1920
height = 1080
fps = 15
target_kbps = 1536

[video1]
code_type = h.265
# H.264 is not available on this chip (see docs/05-video-pipeline.md): keep HEVC.
# enc_type 2 = H.265, profile_type 4 = PROFILE_HEVC_MAIN
enc_type = 2
profile_type = 4
width = 1280
height = 720
fps = 15
target_kbps = 1024

[audio]
code_type = aac
sample_rate = 16000
